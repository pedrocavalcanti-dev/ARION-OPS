<label class="quality-toolbar-control"><span>Período</span><select name="period" data-quality-period>{% for value,label in period_options %}<option value="{{ value }}"{% if period == value %} selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>
<div class="quality-custom-period" data-quality-custom-period{% if period != 'custom' %} hidden{% endif %}><label class="quality-toolbar-control"><span>De</span><input type="date" name="date_from" value="{{ date_from }}"></label><label class="quality-toolbar-control"><span>Até</span><input type="date" name="date_to" value="{{ date_to }}"></label></div>
