<div class="geo-selection-bar" data-geo-controls>
  <label>Macrorregião<select data-region-filter><option value="">Brasil</option><option value="N">Norte</option><option value="NE">Nordeste</option><option value="CO">Centro-Oeste</option><option value="SE">Sudeste</option><option value="S">Sul</option></select></label>
  <label>UF<select data-geo-uf><option value="">Todas as UFs</option></select></label>
  {% if not presentation %}<label>Mês / ano<input type="month" data-geo-month aria-label="Mês e ano da análise"></label>{% else %}<span class="geo-fixed-period">{{ presentation_period }} · cliente fixado</span>{% endif %}
  {% if not presentation %}<label>Categoria<select data-category-filter><option value="">Todas</option><option value="massiva">Massiva</option><option value="rompimento">Rompimento</option><option value="equipamento">Equipamento</option><option value="energia">Energia</option><option value="configuracao">Configuração</option><option value="reset_remoto">Reset remoto</option><option value="financeiro">Pendência financeira</option><option value="demais">Demais motivos técnicos</option><option value="sem_classificacao">Sem classificação</option></select></label>{% endif %}
  <label>Camada visual<select data-geo-layer><option value="analysis">Análise selecionada</option><option value="client">Cliente / projeto</option><option value="calls">Incidentes válidos</option><option value="motives">Categoria predominante</option><option value="rain">Chuva estimada · mm</option><option value="wind">Rajada máxima · km/h</option><option value="correlation">Coincidência temporal · dias</option></select></label>
  {% if not presentation and perms.configuracoes.present_geo %}<a class="geo-text-action" data-present-action href="{% url 'mapa:presentation-start' %}">Apresentar ↗</a>{% endif %}
</div>
