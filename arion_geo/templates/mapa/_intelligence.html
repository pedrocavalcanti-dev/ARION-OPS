<details class="geo-filter-section" open><summary>Região e UF</summary><div class="geo-filter-fields geo-filter-fields--pair">
  <label>Macrorregião<select data-region-filter><option value="">Brasil</option><option value="N">Norte</option><option value="NE">Nordeste</option><option value="CO">Centro-Oeste</option><option value="SE">Sudeste</option><option value="S">Sul</option></select></label>
  <label>UF<select data-geo-uf><option value="">Todas as UFs</option></select></label>
</div></details>
<details class="geo-filter-section" open><summary>Período</summary><div class="geo-filter-fields">
  <label>Mês / ano<input type="month" data-geo-month aria-label="Mês e ano da análise"></label>
  <div class="geo-custom-period" data-custom-period hidden><label>De<input type="date" data-date-from></label><label>Até<input type="date" data-date-to></label><button type="button" data-apply-period>Aplicar período</button></div>
</div></details>
<details class="geo-filter-section"><summary>Chamados e motivos</summary><div class="geo-filter-fields">
  <label>Categoria<select data-category-filter><option value="">Todas</option><option value="massiva">Massiva</option><option value="rompimento">Rompimento</option><option value="equipamento">Equipamento</option><option value="energia">Energia</option><option value="configuracao">Configuração</option><option value="reset_remoto">Reset remoto</option>{% if not presentation %}<option value="financeiro">Pendência financeira</option>{% endif %}<option value="demais">Demais motivos técnicos</option><option value="sem_classificacao">Sem classificação</option></select></label>
  <label data-motives-select hidden>Motivo de fechamento<select data-motive-filter aria-label="Filtrar motivo de fechamento"><option value="">Todos os motivos</option></select></label>
</div></details>
<details class="geo-filter-section"><summary>Camadas do Mapa</summary><div class="geo-filter-fields">
  <label class="geo-checkbox-label"><input type="checkbox" data-weather-icons checked> Exibir ícones meteorológicos</label>
  <label>Condição dos ícones<select data-weather-icon-type><option value="auto">Automático · condição relevante</option><option value="rain">Chuva</option><option value="heat">Calor</option><option value="cold">Frio</option><option value="wind">Vento / rajada</option></select></label>
  <label class="geo-checkbox-label"><input type="checkbox" data-weather-animate checked> Transição diária suave (estimativa)</label>
  <label>Camada visual<select data-geo-layer><option value="analysis">Análise selecionada</option><option value="client">Cliente / projeto</option><option value="calls">Somente chamados</option><option value="motives">Categoria predominante</option><option value="rain">Somente clima · chuva · mm</option><option value="temperature">Temperatura média · °C</option><option value="temperature_min">Temperatura mínima · °C</option><option value="temperature_max">Temperatura máxima · °C</option><option value="wind_speed">Vento máximo · km/h</option><option value="wind">Rajada máxima · km/h</option><option value="direction">Direção dominante · °</option><option value="correlation">Comparação combinada · dias</option></select></label>
</div></details>
