<dialog class="canc-dialog" id="pending-picker" aria-labelledby="pending-picker-title"><header><h2 id="pending-picker-title">{{ title }}</h2><button type="button" class="canc-close" data-close-dialog aria-label="Fechar">×</button></header><div class="canc-dialog-body"><div class="canc-field"><label for="pending-choice">Selecione a pendência</label><select id="pending-choice">{% for item in pendings %}<option value="{{ item.pk }}">{{ item.get_kind_display }} · {{ item.description|truncatechars:80 }}</option>{% endfor %}</select></div><div data-form-feedback role="alert"></div></div><footer><button type="button" class="canc-button" data-close-dialog>Cancelar</button><button type="button" class="canc-button canc-button--primary" data-pending-picker="{{ picker_url }}">Continuar</button></footer></dialog>
